name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode disponibles
        run: ls -d /Applications/Xcode*.app && xcodebuild -version
      - name: Compiler l'app macOS
        run: |
          xcodebuild \
            -project GithubDahboard.xcodeproj \
            -target GithubDahboard \
            -sdk macosx \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
